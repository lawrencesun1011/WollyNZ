name = "goalnz-ai-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-11"

# 部署：npx wrangler deploy -c workers/ai-proxy/wrangler.toml
#
# 密钥（AI_API_KEY）不要写在本文件，使用 Cloudflare Secret 注入：
#   npx wrangler secret put AI_API_KEY -c workers/ai-proxy/wrangler.toml
#
# 本地开发：在同目录创建 .dev.vars（已被 .gitignore 忽略），内容形如：
#   AI_API_KEY=sk-or-v1-xxxxxxxx
# 然后 npx wrangler dev -c workers/ai-proxy/wrangler.toml

[vars]
# 供应商 base（OpenAI 兼容）。当前接入 OpenRouter 免费路由，成本为 0。
AI_BASE_URL = "https://openrouter.ai/api/v1"
# openrouter/free 会在当前可用免费模型间自动择优；若需要行为稳定，
# 可改成具体的免费模型 slug，例如 "deepseek/deepseek-chat-v3.1:free"。
AI_MODEL = "openrouter/free"
# 允许的前端来源（逗号分隔）；localhost 在代码里始终放行，这里只列线上域名。
ALLOWED_ORIGINS = "https://goalnz.pages.dev"

[observability]
enabled = true
